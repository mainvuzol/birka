name: CI

# Once per change. A pull request runs at each push to its branch, on the
# branch merged into its base; main runs at each push, on what was merged. A
# branch pushed with no pull request runs nothing: open one (a draft will
# do). GitHub runs no pull request's CI while it has a merge conflict: merge
# its base in first, or run CI on the branch by hand (Actions → CI → Run
# workflow). Running on a feat/ branch's pushes as well ran every job twice
# for each push to a pull request, and spent the minutes twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run at a time per pull request (its ref is refs/pull/<n>/merge), and
# one for main: a newer push cancels the run it makes out of date.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job reads the repository and writes nothing to it. The token a job
# gets is the token the packages it installs could use: no more than this.
permissions:
  contents: read

jobs:
  backend:
    name: backend (lint, types, contracts, tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        # ADR-0002: UNIQUE NULLS NOT DISTINCT needs PostgreSQL >= 15.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: birka
          POSTGRES_PASSWORD: birka
          POSTGRES_DB: birka_test
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=uk-UA --locale=C.UTF-8"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U birka -d birka_test"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      BIRKA_APP_ENV: ci
      BIRKA_DATABASE_URL: postgresql+asyncpg://birka:birka@localhost:5432/birka_test
      BIRKA_TEST_DATABASE_URL: postgresql+asyncpg://birka:birka@localhost:5432/birka_test
      BIRKA_SESSION_SECRET: ci-session-secret-that-is-long-enough-32
      BIRKA_TELEGRAM_BOT_TOKEN: "123456:ci-placeholder-token"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements-dev.lock

      - name: Install
        # The locked versions, the ones the server's image installs
        # (requirements.lock): a fresh resolution here would test something
        # the server never runs. tests/unit/test_dependency_lock.py then
        # checks that what got installed is what is locked.
        run: |
          pip install -c requirements-dev.lock -e ".[dev]"
          pip check

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy app scripts

      - name: Architecture contracts (ADR-0001)
        run: lint-imports --config pyproject.toml

      - name: Apply migrations
        run: alembic upgrade head

      - name: Migration drift check
        # Fails when the models and the migrations disagree. Autogenerate must
        # produce an empty diff against a freshly migrated database.
        run: alembic check

      - name: Migration downgrade is reversible
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Catalog evaluation regression gate
        run: python -m scripts.evaluate_catalog --output /tmp/catalog-evaluation.json

      - name: Preserve catalog evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-evaluation
          path: /tmp/catalog-evaluation.json
          if-no-files-found: ignore

      - name: PostgreSQL 17 client tools and age, for the backup tests
        # pg_dump refuses a newer server, and the runner's own client is older.
        # From the PostgreSQL project's apt repository, set up by the script
        # postgresql-common ships. age encrypts each copy to the owner's key.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends postgresql-common age
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q --no-install-recommends postgresql-client-17
          echo "BIRKA_PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Tests
        run: pytest -q

      - name: Assert the database tests actually ran
        # A skipped database suite must never be mistaken for a passing one:
        # pytest exits 0 when every test skips, so the exit code proves nothing.
        # Assert the positive (tests passed) and the negative (nothing skipped).
        run: |
          set -o pipefail
          pytest -m integration -q --no-header | tee /tmp/integration.txt
          if ! grep -qE "[0-9]+ passed" /tmp/integration.txt; then
            echo "::error::no integration test passed — the database suite did not run"
            exit 1
          fi
          if grep -qE "[0-9]+ skipped" /tmp/integration.txt; then
            echo "::error::integration tests were skipped in CI (database unreachable?)"
            exit 1
          fi

  restore-drill:
    # The production path end to end: the `ops` image backs up a database on
    # PostgreSQL 17 with the production locale, restores it into a scratch
    # database, and proves the copy (.ai/project-memory/backup-restore-runbook.md).
    name: backup and restore drill (ops image, PostgreSQL 17)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: birka
          POSTGRES_PASSWORD: birka
          POSTGRES_DB: birka
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=uk-UA --locale=C.UTF-8"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U birka -d birka"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: The server's compose file is valid, every service and profile
        # Nothing else reads it before a server does (server-runbook.md).
        run: |
          POSTGRES_PASSWORD=ci BIRKA_APP_DB_PASSWORD=ci BIRKA_TELEGRAM_BOT_TOKEN=ci BIRKA_SESSION_SECRET=ci \
            docker compose -f infra/docker-compose.yml --profile ops config --quiet

      - name: Build the ops image, and the API image beside it
        run: |
          docker build --target ops -t birka-ops backend
          docker build -t birka-api backend

      - name: The API image is still the default target
        run: docker run --rm birka-api sh -c 'test -z "${BIRKA_PG_BIN:-}" && python -c "import app.main"'

      - name: The API image holds exactly the locked packages
        # What the server builds is what the backend job tested: the pins of
        # requirements.lock, nothing missing and nothing added.
        run: |
          docker run --rm birka-api python -c '
          import re, sys
          from importlib.metadata import distributions
          def norm(name):
              return re.sub(r"[-_.]+", "-", name).lower()
          installed = {norm(d.metadata["Name"]): d.version for d in distributions()}
          for tool in ("pip", "setuptools", "wheel"):
              installed.pop(tool, None)
          pins = re.findall(r"^([A-Za-z0-9][A-Za-z0-9._-]*)==(\S+)", open("requirements.lock").read(), re.M)
          locked = {norm(name): version for name, version in pins}
          if installed != locked:
              sys.exit(f"the image differs from requirements.lock: {sorted(set(installed.items()) ^ set(locked.items()))}")
          print(len(locked), "packages, exactly as locked")'

      - name: Migrate, seed, and run the nightly backup as the schedule would
        run: |
          mkdir -p backups keys && chmod 777 backups keys
          ops() {
            docker run --rm --network host -v "$PWD/backups:/backups" -v "$PWD/keys:/keys" \
              -e BIRKA_DATABASE_URL=postgresql+asyncpg://birka:birka@localhost:5432/birka \
              -e BIRKA_RESTORE_SCRATCH_URL=postgresql+asyncpg://birka:birka@localhost:5432/postgres \
              -e BIRKA_BACKUP_AGE_RECIPIENTS="${RECIPIENT:-}" \
              -e BIRKA_APP_DB_PASSWORD=ci-app-role-password-made-long-enough-32 \
              birka-ops "$@"
          }
          ops alembic upgrade head
          # The rights of `birka_app`, which the watcher below connects as.
          ops python -m scripts.app_role
          ops python -m scripts.seed_organization --telegram-user-id 1000001
          # The owner's key pair: made here only because CI plays the owner.
          # age-keygen prints the public key on stderr; the key file is 0600.
          RECIPIENT=$(ops sh -c 'age-keygen -o /keys/owner.txt 2>&1 >/dev/null | sed -n "s/^Public key: //p"')
          test -n "$RECIPIENT"
          ops
          cat backups/last-run.json

      - name: The owner's section sees the night, and the watcher starts and stops cleanly
        # What the `backup-watch` service runs, from the API image, and as
        # it connects: as `birka_app` (ADR-0016). The night above must read
        # as OK. Then the watcher runs a few looks — nothing is news, so
        # nothing goes to Telegram — and is stopped as Docker stops it:
        # SIGTERM to PID 1, which it must honour, not wait out.
        run: |
          DB=postgresql+asyncpg://birka_app:ci-app-role-password-made-long-enough-32@localhost:5432/birka
          docker run --rm --network host -e BIRKA_DATABASE_URL=$DB birka-api \
            python -m scripts.backup_watch --status
          docker run -d --name watch --network host -e BIRKA_DATABASE_URL=$DB \
            -e BIRKA_TELEGRAM_BOT_TOKEN=123456:ci-not-a-real-token birka-api \
            python -m scripts.backup_watch --every 2
          sleep 6
          docker stop --time 5 watch
          logs=$(docker logs watch 2>&1)
          echo "$logs"
          echo "$logs" | grep -q backup_watch.started
          echo "$logs" | grep -q backup_watch.stopped
          # Not `! grep`: bash -e ignores a negated command, so that could never fail.
          if grep -q backup_watch.failed <<<"$logs"; then exit 1; fi
          test "$(docker inspect -f '{{.State.ExitCode}}' watch)" = 0

      - name: Only the owner's key opens the copy, and it is the archive that was drilled
        run: |
          test ! -e backups/birka-*[0-9]Z.dump
          docker run --rm -v "$PWD/backups:/backups" -v "$PWD/keys:/keys" birka-ops sh -c '
            set -e
            sealed=$(ls /backups/birka-*.dump.age)
            age --decrypt -i /keys/owner.txt -o /tmp/opened.dump "$sealed"
            expected=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))[\"archive_sha256\"])" "${sealed%.dump.age}.json")
            test "$(sha256sum /tmp/opened.dump | cut -d" " -f1)" = "$expected"
            echo "decrypted archive matches the drilled one: $expected"'

      - name: Preserve the drill report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill-report
          path: |
            backups/last-run.json
            backups/*.drill.json
          if-no-files-found: ignore

  hot-path:
    # M1-028: the two server budgets the release gate quotes — catalogue read
    # p95 <= 300 ms and POST /sales p95 <= 500 ms — measured on the pinned
    # PostgreSQL 17 with the production locale, through one uvicorn process as
    # the server runs it. Until now they were measured only on a laptop, on
    # PostgreSQL 16.2 (hot-path-budget-report.md).
    #
    # On this two-CPU runner the harness, the API and the database share the
    # CPUs. Six sellers asking back to back came within 3 % of a budget in its
    # first two runs, while one seller had ten times headroom. So CI fails on
    # what one seller sees and prints the rest; the release reading
    # (BIRKA_PERF_GATE=all, the default) still fails on every case.
    name: hot path budgets (PostgreSQL 17)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: birka
          POSTGRES_PASSWORD: birka
          # The harness refuses any database not named birka_perf.
          POSTGRES_DB: birka_perf
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=uk-UA --locale=C.UTF-8"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U birka -d birka_perf"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      BIRKA_APP_ENV: ci
      BIRKA_DATABASE_URL: postgresql+asyncpg://birka:birka@localhost:5432/birka_perf
      BIRKA_PERF_DATABASE_URL: postgresql+asyncpg://birka:birka@localhost:5432/birka_perf
      BIRKA_PERF_API_URL: http://127.0.0.1:58043
      BIRKA_TELEGRAM_BOT_TOKEN: "123456:ci-placeholder-token"
      BIRKA_SESSION_SECRET: ci-session-secret-that-is-long-enough-32
      BIRKA_LOG_LEVEL: WARNING
      BIRKA_PERF_GATE: one-seller

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements-dev.lock

      - name: Install
        run: |
          pip install -c requirements-dev.lock -e ".[dev]"
          pip check

      - name: Migrate, and start the API as the server runs it
        run: |
          alembic upgrade head
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 58043 \
            --no-access-log > /tmp/birka-perf-api.log 2>&1 &
          for attempt in $(seq 30); do
            curl -fsS http://127.0.0.1:58043/api/v1/health && exit 0
            sleep 1
          done
          cat /tmp/birka-perf-api.log
          exit 1

      - name: Measure, and fail on a budget breached
        # pipefail: tee must not hide the harness's own exit status.
        run: |
          set -o pipefail
          python -m scripts.measure_hot_path 2>&1 | tee /tmp/hot-path.txt

      - name: Breaches that do not fail the run, where they are seen
        # A case over its budget that this run does not gate (six sellers at
        # once, on a shared two-CPU runner) is printed "(not gated)" above,
        # and was seen only by whoever opened the artifact. It becomes a
        # warning on the run and a line in its summary. What fails is
        # unchanged: this step reads the harness's JSON and never fails.
        if: always()
        continue-on-error: true
        shell: python
        env:
          HOT_PATH_OUTPUT: /tmp/hot-path.txt
        run: |
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["HOT_PATH_OUTPUT"])
          text = path.read_text(encoding="utf-8", errors="replace") if path.exists() else ""
          # The harness ends with its rows, one JSON list.
          rows = []
          decoder = json.JSONDecoder()
          at = len(text)
          while not rows and at > 0:
              at = text.rfind("\n[", 0, at)
              if at < 0:
                  break
              try:
                  found, _ = decoder.raw_decode(text, at + 1)
              except ValueError:
                  continue
              if isinstance(found, list) and all(isinstance(row, dict) for row in found):
                  rows = found
          if not rows:
              print("no figures to read")

          def ms(value):
              return f"{value:.1f}" if isinstance(value, (int, float)) else str(value)

          breached = [row for row in rows if row.get("verdict") == "FAIL" and not row.get("gated")]
          said = []
          for row in breached:
              line = (
                  f"{row.get('case')}: p95 {ms(row.get('p95'))} ms, "
                  f"over its {ms(row.get('budget'))} ms budget (not gated)"
              )
              escaped = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::warning title=Hot path over budget (not gated)::{escaped}")
              said.append(f"- {line}")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary and said:
              with open(summary, "a", encoding="utf-8") as out:
                  out.write("### Hot path: over budget, not gated\n\n" + "\n".join(said) + "\n")
          print(f"{len(breached)} case(s) over budget and not gated")

      - name: Preserve the figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hot-path
          path: |
            /tmp/hot-path.txt
            /tmp/birka-perf-api.log
          if-no-files-found: ignore

  e2e:
    # M1-027: every Playwright journey, through the real API into PostgreSQL 17
    # with the production locale, on a phone profile (Pixel 7). Until now the
    # suite ran only on a developer's machine, against PostgreSQL 16.2.
    #
    # The seed refuses any database but this exact one — user birka_review, no
    # password, 127.0.0.1:55442, birka_orders_ui — so it can never be pointed
    # at a real shop by mistake. The service is shaped to match.
    name: end to end (Playwright, real API, PostgreSQL 17)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: birka_review
          POSTGRES_DB: birka_orders_ui
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=uk-UA --locale=C.UTF-8"
        ports: ["55442:5432"]
        options: >-
          --health-cmd "pg_isready -U birka_review -d birka_orders_ui"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      BIRKA_APP_ENV: ci
      BIRKA_DATABASE_URL: postgresql+asyncpg://birka_review@127.0.0.1:55442/birka_orders_ui
      BIRKA_TEST_DATABASE_URL: postgresql+asyncpg://birka_review@127.0.0.1:55442/birka_orders_ui
      BIRKA_E2E_FIXTURE: /tmp/birka-e2e-fixture.json
      # The token the specs sign their Telegram launch data with.
      BIRKA_TELEGRAM_BOT_TOKEN: "123456:TEST-TOKEN-not-a-real-secret"
      BIRKA_SESSION_SECRET: ci-e2e-session-secret-long-enough-32
      BIRKA_LOG_JSON: "false"
      # Every journey signs in from this one address, far more often than
      # people do; a server keeps the limit of 30 a minute (rate_limit.py).
      BIRKA_SIGN_INS_PER_MINUTE: "100000"
      BIRKA_SIGN_IN_BURST: "100000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock

      - name: Install the API
        working-directory: backend
        run: |
          pip install -c requirements.lock -e .
          pip check

      - name: Migrate and seed the synthetic shop
        working-directory: backend
        run: |
          alembic upgrade head
          BIRKA_APP_DB_PASSWORD=ci-e2e-app-role-password-long-enough-32 python -m scripts.app_role
          python -m scripts.seed_orders_e2e
          test -s "$BIRKA_E2E_FIXTURE"

      - name: Start the API
        working-directory: backend
        # As `birka_app`, as on the server: every journey proves its rights
        # are enough (ADR-0016). The seed and the specs' server commands
        # stay the owner.
        run: |
          BIRKA_DATABASE_URL=postgresql+asyncpg://birka_app@127.0.0.1:55442/birka_orders_ui \
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 58042 \
            > /tmp/birka-e2e-api.log 2>&1 &
          for attempt in $(seq 30); do
            curl -fsS http://127.0.0.1:58042/api/v1/health && exit 0
            sleep 1
          done
          cat /tmp/birka-e2e-api.log
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the app and its browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Every journey, against the real API
        working-directory: frontend
        run: npx playwright test

      - name: Preserve traces and the API log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            frontend/test-results
            /tmp/birka-e2e-api.log
          if-no-files-found: ignore

  frontend:
    name: frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `npm ci` installs exactly the locked tree and fails if package.json and
      # the lockfile disagree. `npm install` would silently resolve something
      # else, which is how a dependency reaches production unreviewed.
      - run: npm ci
      # Dependabot could not act on the vite advisories while no lockfile
      # existed. Failing the build on a known vulnerability keeps that visible.
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  python-audit:
    # The backend's side of the frontend's `npm audit`: fail on a known
    # vulnerability in any package the server's image installs. It reads
    # requirements.lock as it stands, pinned, so the answer is about exactly
    # those versions. An exception goes in as `--ignore-vuln <ID>`, with a
    # comment saying why and until when, and never silently.
    name: backend (known vulnerabilities in the locked packages)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit requirements.lock
        run: |
          pip install pip-audit==2.9.0
          pip-audit --strict --no-deps --disable-pip --progress-spinner off -r requirements.lock

  edge:
    # The server's front door, as the server runs it: Caddy with
    # infra/Caddyfile, the bundle the `web` image publishes, and the API image
    # behind them, from the server's own compose file. Nothing else reads the
    # Caddyfile or builds the web image before a server does. Plain HTTP on
    # :80 (an address with a scheme gets no certificate); the rest is as on
    # the server, the API starting as `production`, compose's default.
    name: edge (Caddy, the published bundle, headers and limits)
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-edge
      BIRKA_APP_DB_PASSWORD: ci-edge-app-role-password-long-enough-32
      BIRKA_TELEGRAM_BOT_TOKEN: "123456:ci-not-a-real-token"
      # 32 bytes or more, or the API refuses to start as `production`.
      BIRKA_SESSION_SECRET: ci-edge-session-secret-that-is-long-enough-32
      BIRKA_DOMAIN: http://localhost
      # The build's version, as the server's runbook gives it (compose passes
      # it to every image it builds).
      BIRKA_RELEASE: ${{ github.sha }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Caddy accepts the Caddyfile, as a server with a real domain reads it
        run: |
          docker run --rm -e BIRKA_DOMAIN=birka.example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Only Caddy publishes a port
        # The API believes the X-Forwarded-For of whoever reaches it
        # (backend/Dockerfile), and Docker opens a published port ahead of
        # the server's firewall: the database or the API must never be one.
        run: |
          published=$(docker compose --profile ops config --format json \
            | jq -c '[.services | to_entries[] | select((.value.ports // []) | length > 0) | .key]')
          echo "services that publish ports: $published"
          test "$published" = '["caddy"]'

      - name: Build the images and start the stack
        run: |
          docker compose up -d --build caddy
          for attempt in $(seq 60); do
            curl -fsS http://localhost/api/v1/health && exit 0
            sleep 2
          done
          docker compose ps -a
          docker compose logs --no-color
          exit 1

      - name: The API is ready behind the edge, healthy to Docker, and keeps its internals in
        run: |
          fail() { echo "::error::$*"; exit 1; }
          status_of() { curl -s -o /dev/null -w '%{http_code}' "$@" || true; }
          base=http://localhost

          # Ready means migrated, and the API's role given its rights, so
          # both first, from `ops`, as the runbook does.
          docker compose --profile ops run --rm --no-deps ops alembic upgrade head
          docker compose --profile ops run --rm --no-deps ops python -m scripts.app_role
          for attempt in $(seq 15); do
            code=$(status_of "$base/api/v1/ready")
            if [ "$code" = 200 ]; then break; fi
            sleep 2
          done
          test "$code" = 200 || fail "/api/v1/ready answered $code through Caddy, not 200"

          # The API connects as `birka_app`, which is no superuser (ADR-0016).
          who=$(docker compose exec -T api python -c "
          import asyncio
          from sqlalchemy import text
          from app.core.config import get_settings
          from app.core.db import create_engine
          async def main():
              engine = create_engine(get_settings())
              async with engine.connect() as connection:
                  row = (await connection.execute(text(
                      'SELECT current_user, rolsuper FROM pg_roles WHERE rolname = current_user'))).one()
              await engine.dispose()
              print(*row)
          asyncio.run(main())")
          test "$who" = "birka_app False" || fail "the API connects as '$who', not as birka_app"

          # The API's own status is for backup-watch on the compose network:
          # it answers there, and never through Caddy.
          code=$(status_of "$base/internal/status")
          test "$code" = 404 || fail "/internal/status answered $code through Caddy, not 404"
          inside=$(docker compose exec -T api python -c \
            "import urllib.request; print(urllib.request.urlopen('http://api:8000/internal/status', timeout=5).read().decode())") \
            || fail "/internal/status does not answer on the compose network"
          echo "$inside"
          grep -q "\"release\": *\"$BIRKA_RELEASE\"" <<<"$inside" || fail "/internal/status does not name this build"

          # A broken screen's note: no session needed, nothing in return.
          code=$(status_of -H 'Content-Type: application/json' \
            --data '{"kind": "render", "screen": "sale", "name": "TypeError", "message": "ci probe", "release": "ci", "request_id": null}' \
            "$base/api/v1/client-errors")
          test "$code" = 204 || fail "POST /api/v1/client-errors answered $code, not 204"

          # The image knows its build.
          release=$(docker compose exec -T api printenv BIRKA_RELEASE || true)
          test "$release" = "$BIRKA_RELEASE" || fail "the API says it is build '$release', not $BIRKA_RELEASE"

          # Docker's own view, from the healthcheck in the compose file.
          for attempt in $(seq 60); do
            health=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q api)")
            if [ "$health" = healthy ]; then docker compose ps; exit 0; fi
            sleep 3
          done
          docker compose ps -a
          fail "the API is not healthy to Docker after 3 minutes (last: $health)"

      - name: No container may change its image, gain a privilege, or grow past its memory
        # ADR-0017, as Docker runs it: a read-only image, every kernel
        # privilege dropped but the one each keeps, none gained by running a
        # program, and a memory limit. Then, inside the API, a write to its
        # image refused and no privilege held at all.
        run: |
          fail() { echo "::error::$*"; exit 1; }
          for service in db api caddy web; do
            ids=$(docker compose ps -a -q "$service")
            test -n "$ids" || fail "$service did not run"
            case "$service" in
              db) kept="[CAP_CHOWN CAP_DAC_READ_SEARCH CAP_FOWNER CAP_SETGID CAP_SETUID]" ;;
              caddy) kept="[CAP_NET_BIND_SERVICE]" ;;
              *) kept="[]" ;;
            esac
            for id in $ids; do
              shape=$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}} {{.HostConfig.CapDrop}} {{.HostConfig.CapAdd}} {{.HostConfig.SecurityOpt}} {{.HostConfig.Memory}}' "$id")
              echo "$service: $shape"
              case "$shape" in
                "true [ALL] $kept [no-new-privileges:true] 0") fail "$service has no memory limit" ;;
                "true [ALL] $kept [no-new-privileges:true] "*) ;;
                *) fail "$service is not limited as compose says: $shape" ;;
              esac
            done
          done
          if docker compose exec -T api sh -c 'touch /app/probe' 2>/dev/null; then
            fail "the API can write its own image"
          fi
          docker compose exec -T api sh -c 'touch /tmp/probe' || fail "the API has no /tmp to write"
          caps=$(docker compose exec -T api grep CapEff /proc/1/status)
          echo "$caps"
          grep -q '0000000000000000' <<<"$caps" || fail "the API holds a kernel privilege: $caps"

      - name: What the edge sends
        run: |
          fail() { echo "::error::$*"; exit 1; }
          headers_of() { curl -fsS -o /dev/null -D - "$@" | tr -d '\r'; }
          status_of() { curl -s -o /dev/null -w '%{http_code}' "$@" || true; }
          base=http://localhost

          # The page: asked again on every open, framed only by Telegram.
          page=$(headers_of "$base/")
          echo "$page"
          grep -qix 'cache-control: no-cache' <<<"$page" || fail "the page is not revalidated on every open"
          grep -qi '^content-security-policy:.*frame-ancestors https://web.telegram.org' <<<"$page" \
            || fail "no frame-ancestors for Telegram"
          grep -qix 'x-content-type-options: nosniff' <<<"$page" || fail "nosniff is missing"

          # The script it names: kept for a year and never asked again.
          js=$(curl -fsS "$base/" | grep -o -m1 '/assets/[^"]*\.js' || true)
          test -n "$js" || fail "the page names no script"
          asset=$(headers_of "$base$js")
          echo "$asset"
          grep -qix 'cache-control: public, max-age=31536000, immutable' <<<"$asset" \
            || fail "the bundle is not cached as immutable"

          # A file that is not there is an honest 404, not the page, and not
          # cached for a year.
          test "$(status_of "$base/assets/not-there-0.js")" = 404 || fail "a missing file is not a 404"
          missing=$(curl -s -o /dev/null -D - "$base/assets/not-there-0.js" | tr -d '\r')
          if grep -qi '^cache-control:.*immutable' <<<"$missing"; then fail "a 404 is cached as immutable"; fi

          # No source maps: none named, none served, none on the volume.
          curl -fsS -o /tmp/bundle.js "$base$js"
          if grep -q sourceMappingURL /tmp/bundle.js; then fail "the bundle names a source map"; fi
          test "$(status_of "$base$js.map")" = 404 || fail "a source map is served"
          maps=$(docker compose exec -T caddy find /srv/web -name '*.map')
          test -z "$maps" || fail "source maps on the volume: $maps"

          # The API: never stored, production by default, and the request id
          # is the server's own, whatever a client sends.
          api=$(headers_of "$base/api/v1/health")
          echo "$api"
          grep -qix 'cache-control: no-store' <<<"$api" || fail "API answers may be stored"
          health=$(curl -fsS "$base/api/v1/health")
          grep -Eq '"environment": ?"production"' <<<"$health" || fail "the API is not production by default: $health"
          rid=$(headers_of -H 'X-Request-ID: chosen-by-the-client' "$base/api/v1/health" \
            | grep -i '^x-request-id:' | cut -d' ' -f2 || true)
          test -n "$rid" || fail "the API sent no request id"
          test "$rid" != chosen-by-the-client || fail "a client chose the request id"

          # Bodies: the largest a phone sends is one part of a stock list
          # from a file, under 990 000 bytes (ADR-0014 §11). 999 000 bytes
          # still reach the API, which refuses this one as malformed with its
          # own 4xx; 1 000 001 is past the edge's 1MB (1 000 000 bytes, SI)
          # and refused there with 413, never a 502 a phone would read as an
          # outage. Expect: is cleared so curl sends at once.
          post() {
            head -c "$1" /dev/zero | status_of -H 'Expect:' -H 'Content-Type: application/json' \
              --data-binary @- "$base/api/v1/auth/telegram"
          }
          code=$(post 999000)
          case "$code" in 4??) test "$code" != 413 ;; *) false ;; esac \
            || fail "a 999 000-byte body did not reach the API (got $code)"
          code=$(post 1000001)
          test "$code" = 413 || fail "a 1 000 001-byte body was not refused at the edge (got $code)"
          echo "the edge sends what the server must send"

      - name: Sign-ins are counted per real address, whatever a client claims
        # The API believes X-Forwarded-For (backend/Dockerfile); Caddy writes
        # it from the address it was reached from. A client naming a new
        # address each time must still run out after 30 (rate_limit.py).
        run: |
          limited=0
          for n in $(seq 31); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "X-Forwarded-For: 198.51.100.$n" \
              -H 'Content-Type: application/json' --data '{"init_data": "x"}' \
              http://localhost/api/v1/auth/telegram || true)
            if [ "$code" = 429 ]; then limited=1; break; fi
          done
          test "$limited" = 1 || { echo "::error::31 sign-ins with made-up addresses were never limited"; exit 1; }

      - name: The edge's own log keeps no query string
        # With the API down, Caddy logs the failed request itself.
        run: |
          fail() { echo "::error::$*"; exit 1; }
          docker compose stop api
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "http://localhost/api/v1/credits/customers?store_id=00000000-0000-0000-0000-000000000000&query=0671234567" || true)
          test "$code" = 502 || fail "expected 502 with the API down (got $code)"
          logs=$(docker compose logs --no-color caddy)
          grep -q 'credits/customers' <<<"$logs" || fail "Caddy did not log the failed request"
          if grep -q 0671234567 <<<"$logs"; then fail "Caddy's log keeps the search"; fi
          docker compose start api
          for attempt in $(seq 60); do
            curl -fsS http://localhost/api/v1/health >/dev/null && exit 0
            sleep 2
          done
          fail "the API did not come back"

      - name: A new bundle keeps the previous one's files and drops month-old ones
        run: |
          fail() { echo "::error::$*"; exit 1; }
          status_of() { curl -s -o /dev/null -w '%{http_code}' "$@" || true; }
          # What earlier builds left on the volume: a file one published a
          # moment ago, and one not published since 2000.
          # And a page live since 2000 whose script is that old: it counts
          # from the moment it is replaced, not from when it was published.
          docker compose run --rm --no-deps --entrypoint sh web -c '
            set -e
            echo "export {}" > /output/assets/previous-build.js
            echo "export {}" > /output/assets/long-gone.js
            echo "export {}" > /output/assets/live-since-2000.js
            touch -d "2000-01-01 00:00:00" /output/assets/long-gone.js /output/assets/live-since-2000.js
            echo "<script type=\"module\" src=\"/assets/live-since-2000.js\"></script>" > /output/index.html'
          docker compose run --rm --no-deps web
          test "$(status_of http://localhost/assets/previous-build.js)" = 200 \
            || fail "a previous bundle's file was deleted"
          test "$(status_of http://localhost/assets/live-since-2000.js)" = 200 \
            || fail "the bundle just replaced was deleted"
          test "$(status_of http://localhost/assets/long-gone.js)" = 404 \
            || fail "a file not published for 30 days was kept"
          test "$(status_of http://localhost/)" = 200 || fail "the page is gone after a republish"

      - name: The stack, when something failed
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color
