# The server's Python packages: every package that pyproject.toml's
# dependencies reach on Linux, each at the one version CI tests.
# backend/Dockerfile installs exactly this file, with --no-deps, so the image
# the server builds holds what the tests ran against, not whatever PyPI offers
# on the day of the build (the SQLAlchemy 2.1 typing break of 2026-09-25 came
# in that way). Checking out an earlier commit to go back restores that
# commit's versions too.
#
# CI and developers install with it as constraints:
#   pip install -c requirements.lock -e .
# requirements-dev.lock is the same set plus the test and lint tools.
#
# A version changes on purpose, never by accident: change the pin here and in
# requirements-dev.lock, install from them, and let the full CI run decide. A
# new dependency comes with everything it pulls in. With network, this prints
# the new set (keep this header):
#   uv pip compile pyproject.toml --python-version 3.12 --python-platform linux --upgrade-package <name>
# tests/unit/test_dependency_lock.py fails when a file drifts from
# pyproject.toml, from the other file, or from the installed packages. Nothing
# pyproject.toml does not ask for belongs here (the local PostgreSQL tool
# pgserver, for one).
