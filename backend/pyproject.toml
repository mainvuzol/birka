[project]
name = "birka-backend"
version = "0.1.0"
description = "birka — inventory and sales for two women's outerwear stores (Telegram Mini App)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # SQLAlchemy 2.1 changes Select typing; upgrade separately with full validation.
    # Keep local checks and fresh CI installs on the verified runtime.
    "sqlalchemy[asyncio]==2.0.54",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "structlog>=24.1",
    "pyjwt>=2.9",
    "aiogram>=3.13",
    "sentry-sdk[fastapi]>=2.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    # Pinned exactly, not >=. Formatter and type-checker output is
    # version-sensitive: a newer ruff in CI than in the pre-commit hook means
    # every commit is formatted one way and rejected another. Bump these three
    # together with the pre-commit rev, never separately.
    "ruff==0.16.7",
    "mypy==2.3.1",
    "import-linter==2.15",
    "pre-commit>=3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "DTZ",       # flake8-datetimez — naive datetimes are a bug in this project
    "S",         # bandit
    "RUF",
]
ignore = [
    "S101",  # assert is fine in tests; production code is checked by review
    "B008",  # FastAPI Depends() in defaults is the framework idiom
    # The shop speaks Ukrainian and Russian. Real product names (Лоран, шоколад,
    # Куртки) belong in docstrings, comments and test data; flagging Cyrillic as
    # "ambiguous" would push the domain out of the code that models it.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]          # hard-coded test secrets are intentional
"migrations/versions/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^migrations/versions/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "integration: requires a real PostgreSQL database (BIRKA_TEST_DATABASE_URL)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

# ---------------------------------------------------------------------------
# import-linter — ADR-0001 module boundaries (invariant I19)
#
# A contract may only name modules that exist: import-linter fails with
# "module does not exist" otherwise. So each contract is added together with
# the module it constrains, and every gate task that introduces a module also
# adds its contract. Contracts still to be added:
#
#   M1C  parser reads no catalog state (I21)
#        source: app.modules.catalog.parsing
#        forbidden: app.modules.catalog.matching, .repository, app.core.db
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Layered architecture: api -> modules -> core"
type = "layers"
layers = ["app.api", "app.modules", "app.core"]

[[tool.importlinter.contracts]]
name = "core must not depend on any module"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.modules", "app.api"]

[[tool.importlinter.contracts]]
name = "tenancy is the base module and depends on no sibling"
type = "forbidden"
source_modules = ["app.modules.tenancy"]
forbidden_modules = ["app.modules.identity", "app.modules.authz"]

# ADR-0001 permitted edges among the modules that exist today, encoded as a
# layering: identity (authentication) may use authz (authorization), which may
# use tenancy. The reverse direction is what would create a cycle, and this
# contract is what stops it.
[[tool.importlinter.contracts]]
name = "module layering: identity -> authz -> tenancy"
type = "layers"
layers = ["app.modules.identity", "app.modules.authz", "app.modules.tenancy"]

[[tool.importlinter.contracts]]
name = "catalog is a leaf: it may not import another business module"
type = "forbidden"
source_modules = ["app.modules.catalog"]
forbidden_modules = [
    "app.modules.inventory",
    "app.modules.sales",
    "app.modules.refunds",
    "app.modules.transfers",
    "app.modules.orders",
    "app.modules.snapshots",
]

[[tool.importlinter.contracts]]
name = "authz must not depend on business modules"
type = "forbidden"
source_modules = ["app.modules.authz"]
forbidden_modules = [
    "app.modules.catalog",
    "app.modules.inventory",
    "app.modules.sales",
    "app.modules.refunds",
    "app.modules.transfers",
    "app.modules.orders",
    "app.modules.snapshots",
    "app.modules.audit",
]

# ADR-0001 permits `refunds -> sales, inventory, authz, tenancy, core` (+ audit).
# Catalog is deliberately absent: a refund's money and labels come from the
# frozen SaleItem snapshot, never from live catalog rows. Without this contract,
# "improving" a refund receipt by looking the product up again is one import
# away, and it would break invariant I8 for every refunded receipt.
[[tool.importlinter.contracts]]
name = "refunds read history, not the catalog"
type = "forbidden"
source_modules = ["app.modules.refunds"]
forbidden_modules = ["app.modules.catalog", "app.modules.transfers", "app.modules.snapshots"]
# Only DIRECT imports are forbidden. Reaching catalog underneath
# `sales.service` (which freezes the receipt) or `inventory.service` (which
# validates stock references) is the supported path; what must not exist is a
# refund reading the catalog for itself.
allow_indirect_imports = true

# ADR-0001 permits `transfers -> inventory, authz, tenancy, core` (+ audit).
# A transfer moves goods and nothing else: it has no receipt to read, no money
# to take back and no product to name, so sales, refunds and catalog are all
# absent. The one that matters most is catalog — a transfer that "helpfully"
# resolved a product itself would be deciding stock identity outside the
# inventory module, which is the single door invariant I3 depends on.
[[tool.importlinter.contracts]]
name = "transfers move stock through inventory and read nothing else"
type = "forbidden"
source_modules = ["app.modules.transfers"]
forbidden_modules = [
    "app.modules.sales",
    "app.modules.refunds",
    "app.modules.catalog",
    "app.modules.identity",
    "app.modules.snapshots",
]
# Only DIRECT imports are forbidden. Reaching catalog underneath
# `inventory.service`, which validates that a stock key exists, is the
# supported path.
allow_indirect_imports = true

# ADR-0001 permits `sales -> inventory, catalog, authz, tenancy, core` (+ audit).
# `refunds -> sales` is permitted, so the reverse would close a cycle; and a
# sale that could reach the transfer command could move goods between
# warehouses under a sale — the disguised transfer invariant I24 rules out.
# Nothing stopped either import until the M1-018 review found the gap.
[[tool.importlinter.contracts]]
name = "a sale neither refunds nor transfers"
type = "forbidden"
source_modules = ["app.modules.sales"]
forbidden_modules = [
    "app.modules.refunds",
    "app.modules.transfers",
    "app.modules.orders",
    "app.modules.snapshots",
]

# A sale paid in parts (owner decisions, 2026-10-01): the credit module keeps
# what is owed and moves no goods. Returns reach it through the refund, which
# hands it the returned goods' worth; it never reaches back into a refund or
# the ledger, so what is owed can never move stock or the other way round.
[[tool.importlinter.contracts]]
name = "credit keeps money owed and moves no stock"
type = "forbidden"
source_modules = ["app.modules.credit"]
forbidden_modules = [
    "app.modules.inventory",
    "app.modules.refunds",
    "app.modules.transfers",
    "app.modules.orders",
    "app.modules.snapshots",
    "app.modules.damaged",
]
# Only DIRECT imports: the sale it reads necessarily sits on inventory.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "inventory may read catalog but sales may not write stock directly"
type = "forbidden"
source_modules = ["app.modules.inventory"]
forbidden_modules = [
    "app.modules.sales",
    "app.modules.refunds",
    "app.modules.transfers",
    "app.modules.orders",
    "app.modules.snapshots",
]

[[tool.importlinter.contracts]]
name = "only the inventory module may write stock (invariant I3)"
type = "forbidden"
source_modules = [
    "app.modules.sales",
    "app.modules.refunds",
    "app.modules.transfers",
    "app.modules.orders",
    "app.modules.snapshots",
    "app.modules.catalog",
    "app.api",
]
forbidden_modules = ["app.modules.inventory.repository"]
# Only DIRECT imports are forbidden: going through inventory.service is the
# supported path and necessarily reaches the repository underneath it.
allow_indirect_imports = true

# M1-020: parser output depends only on the input and its version.
[[tool.importlinter.contracts]]
name = "catalog parser cannot consult database or mutable catalog knowledge"
type = "forbidden"
source_modules = ["app.modules.catalog.parser"]
forbidden_modules = [
    "app.core.db",
    "app.modules.catalog.models",
    "app.modules.catalog.evidence",
    "app.modules.catalog.matching",
    "app.modules.catalog.read",
    "app.modules.catalog.service",
    "app.modules.inventory",
    "app.modules.orders",
    "app.modules.sales",
    "app.modules.refunds",
    "app.modules.transfers",
    "app.modules.snapshots",
    "app.modules.authz",
    "app.modules.tenancy",
]

# ADR-0005 permits `snapshots -> inventory, catalog, authz, tenancy, core`
# (+ audit). A legacy stock list writes its lines as catalog evidence and its
# approved answers as opening stock, and it does nothing else: it sells
# nothing, returns nothing, moves nothing between warehouses and takes no
# orders. Anything more would be a second, unreviewed way into the ledger.
[[tool.importlinter.contracts]]
name = "a legacy stock list opens a ledger and does nothing else"
type = "forbidden"
source_modules = ["app.modules.snapshots"]
forbidden_modules = [
    "app.modules.sales",
    "app.modules.refunds",
    "app.modules.transfers",
    "app.modules.orders",
    "app.modules.identity",
]
# Only DIRECT imports are forbidden: `inventory.service` and `catalog.read`
# reach other modules underneath, which is the supported path.
allow_indirect_imports = true

# ADR-0001 (2026-09-28 amendment) and ADR-0005: no module imports the legacy
# list workflow, directly or not. It consumes the ledger and the catalog; a
# module that reached into it could apply or read a list outside its checks.
# Only the API and the model registry may name it.
[[tool.importlinter.contracts]]
name = "nothing depends on the legacy list workflow"
type = "forbidden"
source_modules = [
    "app.core",
    "app.modules.audit",
    "app.modules.authz",
    "app.modules.damaged",
    "app.modules.catalog",
    "app.modules.identity",
    "app.modules.inventory",
    "app.modules.orders",
    "app.modules.refunds",
    "app.modules.sales",
    "app.modules.tenancy",
    "app.modules.transfers",
]
forbidden_modules = ["app.modules.snapshots"]

# M1-028: the owner hears about the server's backups (ADR-0001, 2026-09-30
# amendment). `backups → authz, identity, telegram, core`: it asks authz who
# holds `backup:view`, identity for their Telegram chats, and sends through
# telegram. It reads no shop's business — a backup is of the whole server —
# and no module imports it: only the API and the scripts that run the nights
# and the watcher.
[[tool.importlinter.contracts]]
name = "backups reads no shop's business"
type = "forbidden"
source_modules = ["app.modules.backups"]
forbidden_modules = [
    "app.modules.catalog",
    "app.modules.inventory",
    "app.modules.sales",
    "app.modules.refunds",
    "app.modules.transfers",
    "app.modules.orders",
    "app.modules.snapshots",
    "app.modules.audit",
    "app.modules.tenancy",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "nothing depends on the backups section"
type = "forbidden"
source_modules = [
    "app.core",
    "app.modules.audit",
    "app.modules.authz",
    "app.modules.damaged",
    "app.modules.catalog",
    "app.modules.identity",
    "app.modules.inventory",
    "app.modules.orders",
    "app.modules.refunds",
    "app.modules.sales",
    "app.modules.snapshots",
    "app.modules.telegram",
    "app.modules.tenancy",
    "app.modules.transfers",
]
forbidden_modules = ["app.modules.backups"]

# ADR-0001 names `telegram → identity, core`. Today it only sends a message,
# and needs neither: it must not grow a way into the shop's data.
[[tool.importlinter.contracts]]
name = "telegram only talks to Telegram"
type = "forbidden"
source_modules = ["app.modules.telegram"]
forbidden_modules = [
    "app.modules.audit",
    "app.modules.authz",
    "app.modules.catalog",
    "app.modules.identity",
    "app.modules.inventory",
    "app.modules.orders",
    "app.modules.refunds",
    "app.modules.sales",
    "app.modules.snapshots",
    "app.modules.tenancy",
    "app.modules.transfers",
]

# 2026-10-01 (ADR-0001 amendment): module `damaged` owns `damaged_unit`, the
# units a return put in a store's «Брак». `damaged → transfers, inventory,
# authz, tenancy, core` (+ audit): a unit goes back on sale as a transfer and
# is written off as a stock adjustment, through those modules' own services.
# Only `refunds` (which registers the units) and the API may import it.
[[tool.importlinter.contracts]]
name = "damaged goods move only through the ledger's own commands"
type = "forbidden"
source_modules = ["app.modules.damaged"]
forbidden_modules = [
    "app.modules.sales",
    "app.modules.refunds",
    "app.modules.catalog",
    "app.modules.orders",
    "app.modules.snapshots",
    "app.modules.identity",
    "app.modules.backups",
    "app.modules.inventory.repository",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "only a return puts units in «Брак»"
type = "forbidden"
source_modules = [
    "app.core",
    "app.modules.audit",
    "app.modules.authz",
    "app.modules.backups",
    "app.modules.catalog",
    "app.modules.identity",
    "app.modules.inventory",
    "app.modules.orders",
    "app.modules.sales",
    "app.modules.snapshots",
    "app.modules.telegram",
    "app.modules.tenancy",
    "app.modules.transfers",
]
forbidden_modules = ["app.modules.damaged"]

# 2026-10-01 (ADR-0001 amendment): module `stores` changes a store's state —
# trading, blocked, archived — on the owner's word. `stores → inventory,
# orders, identity, authz, tenancy, core` (+ audit): it reads how many units
# stand in the store's own warehouses and «Брак» and how many of its orders
# are open, because only an empty store is archived. It moves no goods and no
# money; what a store that does not trade may not do is refused by the
# person's scope and held at the ledger's door, never by this module.
[[tool.importlinter.contracts]]
name = "a store's state changes nothing but the state"
type = "forbidden"
source_modules = ["app.modules.stores"]
forbidden_modules = [
    "app.modules.sales",
    "app.modules.refunds",
    "app.modules.transfers",
    "app.modules.snapshots",
    "app.modules.credit",
    "app.modules.damaged",
    "app.modules.catalog",
    "app.modules.backups",
    "app.modules.inventory.repository",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "nothing depends on the store-state command"
type = "forbidden"
source_modules = [
    "app.core",
    "app.modules.audit",
    "app.modules.authz",
    "app.modules.backups",
    "app.modules.catalog",
    "app.modules.credit",
    "app.modules.damaged",
    "app.modules.identity",
    "app.modules.inventory",
    "app.modules.orders",
    "app.modules.refunds",
    "app.modules.sales",
    "app.modules.snapshots",
    "app.modules.telegram",
    "app.modules.tenancy",
    "app.modules.transfers",
]
forbidden_modules = ["app.modules.stores"]
