# Local and single-server deployment stack.
# PostgreSQL 17: ADR-0002 requires >= 15 for UNIQUE NULLS NOT DISTINCT.
name: birka

# Docker keeps every container's output, unbounded by default: on a small
# server the API's log alone would fill the disk in time, and the database
# would stop with it. Each service keeps at most 5 × 10 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# The build's version, its git commit, baked into every image it builds:
#   export BIRKA_RELEASE=$(git rev-parse --short HEAD)   # before building
# It names the version in the server's log and error reports and on the
# app's crash screen. Unset, the images say `dev`.
x-release: &release
  BIRKA_RELEASE: ${BIRKA_RELEASE:-dev}

# Each container may change nothing of its own image, holds none of the
# kernel's privileges it does not use, and cannot grow past its memory
# (owner's choice, 2026-10-09; ADR-0017). A process taken over can then
# neither plant a program in its image nor gain a privilege by running one,
# and one that runs away leaves the rest of the server its memory. What a
# service writes goes to its volumes, or to a small /tmp held in memory.
# The memory limits are at least about 2.5 times the most each reached
# under the heaviest work measured (2026-10-09: six sellers at once, a list
# of 10 000 answers approved, a night's backup and drill; the report has
# the figures).
# They are ceilings for a process run away, not shares: together they may
# exceed the server's memory. Swap is not on top of them (memswap_limit the
# same), or a server with swap would let each use twice its limit.
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  db:
    <<: *hardened
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    # The image's entrypoint starts as root, reads the data directory, makes
    # it and its socket's directory its user's, then becomes that user:
    # reading, owning, and changing who it is. Nothing more (without
    # DAC_READ_SEARCH it cannot read its own data directory).
    cap_add: [CHOWN, DAC_READ_SEARCH, FOWNER, SETGID, SETUID]
    tmpfs:
      - /var/run/postgresql:size=1m
      - /tmp:size=64m
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-birka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-birka}
      # ICU, not C. Catalog matching lowercases Ukrainian and Russian product
      # text; under the C locale lower('ОЛЯ') returns 'ОЛЯ' unchanged and the
      # matcher silently misses. initdb locale cannot be changed later without
      # dumping and reloading the database, so it has to be right now.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=uk-UA --locale=C.UTF-8"
    # Terse errors: a refused row's DETAIL ("Failing row contains …", "Key
    # (…)=(…)") would write a customer's name and phone into this container's
    # log. The app hides the same values from its own logs and Sentry.
    command: ["postgres", "-c", "log_error_verbosity=terse"]
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-birka} -d ${POSTGRES_DB:-birka}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published to the host in production; the api reaches it over the
    # compose network. For psql on a laptop use docker-compose.dev.yml. Never
    # publish it on a server, not even in an override: Docker opens published
    # ports ahead of ufw (CI checks that only Caddy publishes any).
    expose:
      - "5432"

  api:
    <<: *hardened
    build:
      context: ../backend
      dockerfile: Dockerfile
      args: *release
    restart: unless-stopped
    logging: *logging
    tmpfs:
      - /tmp:size=16m
    mem_limit: 768m
    memswap_limit: 768m
    depends_on:
      db:
        condition: service_healthy
    environment:
      # `production` unless .env says otherwise: then the API refuses to start
      # without the bot token or with a session secret under 32 bytes. A
      # server whose .env forgot the line is still guarded; only a laptop
      # sets `local`.
      BIRKA_APP_ENV: ${BIRKA_APP_ENV:-production}
      # As `birka_app`, which reads and writes rows and nothing more: not the
      # database's owner, who alone may change the schema, truncate, or turn
      # off the triggers that keep the ledger (ADR-0016). Its rights are
      # given by `scripts.app_role`, from `ops`.
      BIRKA_DATABASE_URL: postgresql+asyncpg://birka_app:${BIRKA_APP_DB_PASSWORD:?BIRKA_APP_DB_PASSWORD is required (server runbook, step 2)}@db:5432/${POSTGRES_DB:-birka}
      BIRKA_TELEGRAM_BOT_TOKEN: ${BIRKA_TELEGRAM_BOT_TOKEN:?bot token is required}
      BIRKA_SESSION_SECRET: ${BIRKA_SESSION_SECRET:?session secret is required}
      BIRKA_SENTRY_DSN: ${BIRKA_SENTRY_DSN:-}
      BIRKA_LOG_JSON: "true"
      # No value here: the shell's, when it exported one, and otherwise the
      # one the image was built with — never a `dev` that hides the build.
      BIRKA_RELEASE:
    # Reached by Caddy over the compose network, and NEVER published: the API
    # believes the X-Forwarded-For of whoever reaches this port, which is
    # safe only while that is Caddy alone (backend/Dockerfile).
    expose:
      - "8000"
    # Ready: its database answers and holds the schema this code expects
    # (`/api/v1/ready`). Shown by `docker compose ps`; Docker does not restart
    # a container for it, and backup-watch tells the owner (it asks the API
    # itself). The image is python:slim, without curl: Python asks.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # The nightly backup, and restore drills (backup-restore-runbook.md):
  #   docker compose --profile ops run --rm ops          # what cron runs daily
  #   docker compose --profile ops run --rm ops python -m scripts.restore_drill /backups/<file>.dump
  # And what only the database's owner may do (server runbook):
  #   docker compose --profile ops run --rm --no-deps ops alembic upgrade head
  #   docker compose --profile ops run --rm --no-deps ops python -m scripts.app_role
  # It needs the database and the owner's age public key, nothing else: no
  # bot token, no session secret, and never the owner's private key. Each
  # night it writes one row, its own record, to `backup_run`, which is all
  # `backup-watch` and the owner's section read.
  # The drill restores into a new scratch database on the same server and
  # drops it afterwards; it writes to no other database. Each step has a time
  # limit, and a night that finds the previous one still running (its lock in
  # the backup directory) starts nothing and is recorded as failed.
  ops:
    <<: *hardened
    profiles: ["ops"]
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: ops
      args: *release
    logging: *logging
    tmpfs:
      - /tmp:size=64m
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    environment:
      # As the database's owner: the backup, its drill, the migrations, and
      # the rights of `birka_app`, whose password it sets (ADR-0016).
      BIRKA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-birka}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-birka}
      BIRKA_APP_DB_PASSWORD: ${BIRKA_APP_DB_PASSWORD:-}
      BIRKA_RESTORE_SCRATCH_URL: postgresql+asyncpg://${POSTGRES_USER:-birka}:${POSTGRES_PASSWORD}@db:5432/postgres
      # Unset, the nightly run fails: copies leave the server only encrypted.
      BIRKA_BACKUP_AGE_RECIPIENTS: ${BIRKA_BACKUP_AGE_RECIPIENTS:-}
      BIRKA_LOG_JSON: "true"
    volumes:
      # Owned by uid 10001, the image's user. The owner's computer collects
      # the encrypted copies from here (infra/pull-backups.sh).
      - ${BIRKA_BACKUP_DIR:-./backups}:/backups

  # Tells the owner when a nightly backup fails, or stops happening
  # (owner decision, 2026-09-30): the «Резервні копії» section reads the same
  # record. It runs all the time, restarted by Docker, and not from cron: a
  # schedule that stopped is exactly what it has to notice. It needs the
  # database and the bot token, and nothing else.
  backup-watch:
    <<: *hardened
    build:
      context: ../backend
      dockerfile: Dockerfile
      args: *release
    restart: unless-stopped
    logging: *logging
    tmpfs:
      - /tmp:size=16m
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "scripts.backup_watch"]
    environment:
      BIRKA_APP_ENV: ${BIRKA_APP_ENV:-production}
      # As `birka_app`, like the API: it reads and writes rows (ADR-0016).
      BIRKA_DATABASE_URL: postgresql+asyncpg://birka_app:${BIRKA_APP_DB_PASSWORD:?BIRKA_APP_DB_PASSWORD is required (server runbook, step 2)}@db:5432/${POSTGRES_DB:-birka}
      BIRKA_TELEGRAM_BOT_TOKEN: ${BIRKA_TELEGRAM_BOT_TOKEN:?bot token is required}
      # The site whose certificate it watches (owner decision, 2026-10-03:
      # the bot tells the owner a week before it runs out). It asks Caddy on
      # the compose network for that name, as a browser would.
      BIRKA_PUBLIC_DOMAIN: ${BIRKA_DOMAIN:-localhost}
      BIRKA_SENTRY_DSN: ${BIRKA_SENTRY_DSN:-}
      BIRKA_LOG_JSON: "true"
      # Trouble on the server goes to the owner and to these administrators
      # (owner decision, 2026-10-03): Telegram user ids, comma-separated.
      BIRKA_ADMIN_TELEGRAM_IDS: ${BIRKA_ADMIN_TELEGRAM_IDS:-}
      # The outside service it checks in with every 10 minutes; empty, none.
      BIRKA_HEARTBEAT_URL: ${BIRKA_HEARTBEAT_URL:-}
      # It asks the API about itself on the compose network, where Caddy
      # never sends anyone (`/internal/status`).
      BIRKA_API_URL: http://api:8000
      BIRKA_RELEASE:
    # The backups' disk, read only: how full it is (a full disk stops the
    # database and the night's copy alike).
    volumes:
      - ${BIRKA_BACKUP_DIR:-./backups}:/backups:ro

  # Builds the Mini App and hands the static bundle to Caddy through a shared
  # volume. It exits once the build is copied; it is not a long-running service.
  web:
    <<: *hardened
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args: *release
    logging: *logging
    mem_limit: 128m
    memswap_limit: 128m
    volumes:
      - web_dist:/output

  caddy:
    <<: *hardened
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    # Ports 80 and 443 are below 1024: binding them is the one privilege.
    cap_add: [NET_BIND_SERVICE]
    tmpfs:
      - /tmp:size=16m
    mem_limit: 256m
    memswap_limit: 256m
    # Started, not healthy: an API not yet ready (its migration not run) must
    # not keep the whole site down with it.
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_completed_successfully
    # 443 over UDP too: Caddy speaks HTTP/3 and tells every browser so, and a
    # phone on mobile data then tries it. Caddy's own Docker example publishes
    # it; `ufw allow 443` opens both. Only Caddy publishes anything.
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      BIRKA_DOMAIN: ${BIRKA_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - web_dist:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  web_dist:
  caddy_data:
  caddy_config:
