# Local and single-server deployment stack.
# PostgreSQL 17: ADR-0002 requires >= 15 for UNIQUE NULLS NOT DISTINCT.
name: birka

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-birka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-birka}
      # ICU, not C. Catalog matching lowercases Ukrainian and Russian product
      # text; under the C locale lower('ОЛЯ') returns 'ОЛЯ' unchanged and the
      # matcher silently misses. initdb locale cannot be changed later without
      # dumping and reloading the database, so it has to be right now.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=uk-UA --locale=C.UTF-8"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-birka} -d ${POSTGRES_DB:-birka}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published to the host in production; the api reaches it over the
    # compose network. Override in docker-compose.override.yml for local psql.
    expose:
      - "5432"

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      BIRKA_APP_ENV: ${BIRKA_APP_ENV:-local}
      BIRKA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-birka}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-birka}
      BIRKA_TELEGRAM_BOT_TOKEN: ${BIRKA_TELEGRAM_BOT_TOKEN:?bot token is required}
      BIRKA_SESSION_SECRET: ${BIRKA_SESSION_SECRET:?session secret is required}
      BIRKA_SENTRY_DSN: ${BIRKA_SENTRY_DSN:-}
      BIRKA_LOG_JSON: "true"
    expose:
      - "8000"

  # The nightly backup, and restore drills (backup-restore-runbook.md):
  #   docker compose --profile ops run --rm ops          # what cron runs daily
  #   docker compose --profile ops run --rm ops python -m scripts.restore_drill /backups/<file>.dump
  # It needs the database and the owner's age public key, nothing else: no
  # bot token, no session secret, and never the owner's private key. Each
  # night it writes one row, its own record, to `backup_run`, which is all
  # `backup-watch` and the owner's section read.
  # The drill restores into a new scratch database on the same server and
  # drops it afterwards; it writes to no other database.
  ops:
    profiles: ["ops"]
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: ops
    depends_on:
      db:
        condition: service_healthy
    environment:
      BIRKA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-birka}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-birka}
      BIRKA_RESTORE_SCRATCH_URL: postgresql+asyncpg://${POSTGRES_USER:-birka}:${POSTGRES_PASSWORD}@db:5432/postgres
      # Unset, the nightly run fails: copies leave the server only encrypted.
      BIRKA_BACKUP_AGE_RECIPIENTS: ${BIRKA_BACKUP_AGE_RECIPIENTS:-}
      BIRKA_LOG_JSON: "true"
    volumes:
      # Owned by uid 10001, the image's user. The owner's computer collects
      # the encrypted copies from here (infra/pull-backups.sh).
      - ${BIRKA_BACKUP_DIR:-./backups}:/backups

  # Tells the owner when a nightly backup fails, or stops happening
  # (owner decision, 2026-09-30): the «Резервні копії» section reads the same
  # record. It runs all the time, restarted by Docker, and not from cron: a
  # schedule that stopped is exactly what it has to notice. It needs the
  # database and the bot token, and nothing else.
  backup-watch:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "scripts.backup_watch"]
    environment:
      BIRKA_APP_ENV: ${BIRKA_APP_ENV:-local}
      BIRKA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-birka}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-birka}
      BIRKA_TELEGRAM_BOT_TOKEN: ${BIRKA_TELEGRAM_BOT_TOKEN:?bot token is required}
      BIRKA_SENTRY_DSN: ${BIRKA_SENTRY_DSN:-}
      BIRKA_LOG_JSON: "true"

  # Builds the Mini App and hands the static bundle to Caddy through a shared
  # volume. It exits once the build is copied; it is not a long-running service.
  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    volumes:
      - web_dist:/output

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_completed_successfully
    ports:
      - "80:80"
      - "443:443"
    environment:
      BIRKA_DOMAIN: ${BIRKA_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - web_dist:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  web_dist:
  caddy_data:
  caddy_config:
