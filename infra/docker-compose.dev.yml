# Local development database only. Not a deployment file.
#
#   docker compose -f infra/docker-compose.dev.yml up -d
#
# Same image and initdb locale as infra/docker-compose.yml and CI, so a test
# that passes here is exercising the same PostgreSQL behaviour. Credentials
# match CI (birka/birka) and are local-only; the port is bound to 127.0.0.1.
# Two databases: `birka` for running the API by hand, `birka_test` for pytest.
name: birka-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: birka
      POSTGRES_PASSWORD: birka
      POSTGRES_DB: birka
      # See infra/docker-compose.yml: ICU is required for Cyrillic lower().
      # birka_test is created from template1 and inherits this locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=uk-UA --locale=C.UTF-8"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dev_db_data:/var/lib/postgresql/data
      - ./dev-db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U birka -d birka_test"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  dev_db_data:
