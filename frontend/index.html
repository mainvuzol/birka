<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Бірка</title>
    <!-- The one face that ships, asked for at once: its «optional» display
         gives it only the first moments to arrive («Усе на бірці», P0-1). -->
    <link
      rel="preload"
      href="/src/assets/fonts/fira-sans-extra-condensed-800.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* Shown only when the app's code never arrives: hidden for its first
         seconds, so a normal open never flashes it. React replaces it. */
      .not-loaded {
        visibility: hidden;
        animation: not-loaded-show 0s linear 8s forwards;
        max-width: 780px;
        margin: auto;
        padding: 24px 18px;
        font-family: ui-sans-serif, system-ui, sans-serif;
        line-height: 1.55;
      }
      @keyframes not-loaded-show {
        to {
          visibility: visible;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="not-loaded">
        <p>
          Застосунок не завантажився. Перевірте зв’язок і відкрийте його ще раз.
        </p>
        <!-- An outage, in practice: the owner's words (ADR-0013 §3). -->
        <p>
          Сервер не відповідає. Продавайте на папері: модель, розмір, ціна, як
          оплачено, час. Коли сервер відповість — внесіть продажі до закриття
          каси.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
